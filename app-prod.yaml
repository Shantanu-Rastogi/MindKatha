runtime: python312
service: default

handlers:
# Static assets (anything with a file extension, including robots.txt and sitemap.xml)
- url: /(.*\.(css|js|png|jpg|jpeg|svg|ico|json|woff2|ttf|eot|webp|avif|txt|xml))
  secure: always
  static_files: dist/mindkatha-app-ng/browser/\1
  upload: dist/mindkatha-app-ng/browser/.*\.(css|js|png|jpg|jpeg|svg|ico|json|woff2|ttf|eot|webp|avif|txt|xml)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"
    Cache-Control: "public, max-age=31536000, immutable"

# Root & SPA fallback (serves Angular index.html for /, /services, /about, /contact, /book, /legal, etc.)
- url: /.*
  secure: always
  static_files: dist/mindkatha-app-ng/browser/index.html
  upload: dist/mindkatha-app-ng/browser/index.html
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "strict-origin-when-cross-origin"
    Content-Security-Policy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com data:; img-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com;"

