runtime: python310
app_engine_apis: true
handlers:

# Static assets (anything with a file extension)
- url: /(.*\..*)
  secure: always
  static_files: dist/\1
  upload: dist/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      script-src 'self' 'unsafe-inline'
        *.google.com
        *.google-analytics.com
        *.googleapis.com
        *.googletagmanager.com
        *.gstatic.com
        *.youtube.com
        *.ytimg.com
        https://unpkg.com;

# Root
- url: /
  secure: always
  static_files: dist/index.html
  upload: dist/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      script-src 'self' 'unsafe-inline'
        *.google.com
        *.google-analytics.com
        *.googleapis.com
        *.googletagmanager.com
        *.gstatic.com
        *.youtube.com
        *.ytimg.com
        https://unpkg.com;

# Paths with a trailing slash
- url: /(.*\/)
  secure: always
  static_files: dist/\1index.html
  upload: dist/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      script-src 'self' 'unsafe-inline'
        *.google.com
        *.google-analytics.com
        *.googleapis.com
        *.googletagmanager.com
        *.gstatic.com
        *.youtube.com
        *.ytimg.com
        https://unpkg.com;

# Paths without a trailing slash
- url: /(.*)?
  secure: always
  static_files: dist/\1/index.html
  upload: dist/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      script-src 'self' 'unsafe-inline'
        *.google.com
        *.google-analytics.com
        *.googleapis.com
        *.googletagmanager.com
        *.gstatic.com
        *.youtube.com
        *.ytimg.com
        https://unpkg.com;
