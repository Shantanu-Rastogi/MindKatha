<section class="reveal faq-section-new" id="faq" style="padding: 6rem 0;">
    <div class="container">
        <div class="section-title" style="text-align: center; margin-bottom: 4rem;">
            <span class="badge" style="display: inline-block; padding: 0.5rem 1rem; background: #e0f2fe; color: #0284c7; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">Clarifications</span>
            <h2 style="font-size: 2.5rem; margin-top: 1rem; margin-bottom: 1rem; color: var(--text-primary);">Frequently Asked Questions.</h2>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto; font-weight: 400;">Everything you need to know about starting your therapy journey with us.</p>
        </div>

        <div class="accordion-wrapper"
            style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem;">
            @for (faq of faqs; track faq.question) {
              <div class="accordion-item"
                  style="background: var(--background-alt); border-radius: var(--radius-md); overflow: hidden; transition: var(--transition);">
                  <div class="accordion-header"
                      style="padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; color: var(--text-primary);">
                      <h4 style="font-size: 1.15rem; font-family: var(--font-sans);">{{ faq.question }}</h4>
                      <i class="ph ph-plus" style="transition: var(--transition);"></i>
                  </div>
                  <div class="accordion-content"
                      style="max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #FFFFFF;">
                      <div style="padding: 1.5rem 2rem; color: var(--text-secondary);">
                          <p>{{ faq.answer }}</p>
                      </div>
                  </div>
              </div>
            }
        </div>
    </div>
</section>
