<!-- Scroll Progress Line -->
<div class="fixed top-0 left-0 h-[3px] bg-gradient-to-r from-[#0284c7] via-[#38bdf8] to-[#818cf8] shadow-[0_0_10px_rgba(56,189,248,0.65)] transition-all duration-100 ease-out z-50" [style.width.%]="scrollPercent"></div>

<!-- Floating Island Navbar Wrapper -->
<div class="w-full px-3 sm:px-6 md:px-8 pt-3 sm:pt-4 pb-4 z-50 fixed top-0 left-0 right-0 flex flex-col items-center pointer-events-none">
  
  <!-- The Glass Pill -->
  <nav class="flex justify-between items-center px-4 sm:px-6 md:px-8 py-2.5 sm:py-3 w-full max-w-7xl rounded-full bg-white/85 backdrop-blur-xl border border-slate-200/80 shadow-[0_8px_32px_rgba(15,23,42,0.06)] pointer-events-auto transition-all duration-300">
    
    <!-- Brand Logo -->
    <a routerLink="/" (click)="isMobileMenuOpen = false" class="flex items-center gap-2 sm:gap-2.5 group">
      <img src="assets/brain-icon.png" alt="MindKatha Brain Logo" class="h-[25px] sm:h-[31px] w-auto object-contain transition-transform group-hover:scale-105">
      <img src="assets/logo.png" alt="MindKatha Logo" class="h-[22px] sm:h-[28px] w-auto object-contain transition-transform group-hover:scale-105">
    </a>

    <!-- Desktop Navigation Links -->
    <ul class="hidden md:flex items-center gap-1 lg:gap-2 text-[14px] lg:text-[15px] text-slate-600 font-medium">
      <li>
        <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90 border border-sky-200/70 shadow-2xs" class="px-3.5 lg:px-4 py-2 rounded-full hover:bg-slate-100/80 hover:text-slate-900 transition-all duration-200">Home</a>
      </li>
      <li>
        <a routerLink="/services" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90 border border-sky-200/70 shadow-2xs" class="px-3.5 lg:px-4 py-2 rounded-full hover:bg-slate-100/80 hover:text-slate-900 transition-all duration-200">Services &amp; Specializations</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90 border border-sky-200/70 shadow-2xs" [routerLinkActiveOptions]="{exact: true}" class="px-3.5 lg:px-4 py-2 rounded-full hover:bg-slate-100/80 hover:text-slate-900 transition-all duration-200">About &amp; Approach</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90 border border-sky-200/70 shadow-2xs" class="px-3.5 lg:px-4 py-2 rounded-full hover:bg-slate-100/80 hover:text-slate-900 transition-all duration-200">Contact &amp; FAQ</a>
      </li>
    </ul>

    <!-- Actions & Mobile Toggle -->
    <div class="flex items-center gap-2 sm:gap-3">
      <a routerLink="/book" class="inline-flex items-center justify-center gap-2 px-4 sm:px-5 py-2 sm:py-2.5 rounded-full bg-[#0284c7] text-white text-xs sm:text-sm font-semibold transition-all duration-300 hover:bg-[#0369a1] shadow-[0_8px_20px_rgba(2,132,199,0.25)] hover:shadow-[0_12px_24px_rgba(2,132,199,0.35)] hover:-translate-y-0.5 cursor-pointer text-decoration-none">
        <span>Book a Session</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="hidden sm:inline"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>

      <!-- Mobile Hamburger Button -->
      <button (click)="toggleMobileMenu()" aria-label="Toggle Menu" class="md:hidden flex items-center justify-center p-2 rounded-full text-slate-800 hover:bg-slate-100 focus:outline-none transition-colors">
        <svg *ngIf="!isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    
  </nav>

  <!-- Mobile Dropdown Menu -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden mt-2 w-full max-w-7xl rounded-2xl bg-white/95 backdrop-blur-2xl border border-slate-200/80 shadow-[0_12px_40px_rgba(15,23,42,0.12)] p-4 pointer-events-auto transition-all animate-fadeIn">
    <ul class="flex flex-col gap-1.5 text-[15px] text-slate-600 font-medium">
      <li>
        <a routerLink="/" (click)="isMobileMenuOpen = false" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90" class="block px-4 py-3 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-all">Home</a>
      </li>
      <li>
        <a routerLink="/services" (click)="isMobileMenuOpen = false" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90" class="block px-4 py-3 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-all">Services &amp; Specializations</a>
      </li>
      <li>
        <a routerLink="/about" (click)="isMobileMenuOpen = false" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90" [routerLinkActiveOptions]="{exact: true}" class="block px-4 py-3 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-all">About &amp; Approach</a>
      </li>
      <li>
        <a routerLink="/contact" (click)="isMobileMenuOpen = false" routerLinkActive="text-[#0284c7] font-semibold bg-sky-50/90" class="block px-4 py-3 rounded-xl hover:bg-slate-50 hover:text-slate-900 transition-all">Contact &amp; FAQ</a>
      </li>
      <li class="pt-2 border-t border-slate-100 mt-1">
        <a routerLink="/book" (click)="isMobileMenuOpen = false" class="flex items-center justify-center gap-2 w-full py-3 rounded-full bg-[#0284c7] text-white text-sm font-semibold transition-all duration-300 hover:bg-[#0369a1] shadow-md cursor-pointer text-decoration-none">
          <span>Book a Session</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </li>
    </ul>
  </div>
</div>
