<!-- Micro-Bar (Absolute Top) -->
<div class="w-full px-6 py-2 flex justify-between items-center absolute top-0 left-0 bg-transparent text-[#40484d] text-xs font-semibold z-50">
  <span>In-Person Private Care in Pune &amp; Secure Telehealth Globally</span>
  <a href="#" class="text-[#00465f] hover:text-[#266293] transition-colors underline">Emergency Crisis Support</a>
</div>

<!-- Floating Island Navbar Wrapper -->
<div class="w-full px-4 sm:px-6 md:px-8 pt-12 pb-4 z-40 relative flex justify-center">
  
  <!-- The Glass Pill -->
  <nav class="flex justify-between items-center px-8 py-3 w-full max-w-7xl rounded-full bg-white/60 backdrop-blur-xl border border-white/30 shadow-[0_8px_32px_rgba(0,70,95,0.08)]">
    
    <!-- Brand Logo -->
    <a routerLink="/" class="flex items-center gap-2 group">
      <img src="assets/logo.png" alt="MindKatha Logo" class="h-10 w-auto object-contain transition-transform group-hover:scale-105">
    </a>

    <!-- Desktop Navigation Links -->
    <ul class="hidden md:flex items-center gap-2 text-[15px] text-[#70787e] font-medium">
      <li>
        <a routerLink="/about" routerLinkActive="text-[#00465f] font-semibold" [routerLinkActiveOptions]="{exact: true}" class="px-4 py-2 rounded-full hover:bg-white/50 hover:text-[#00465f] transition-all duration-300">Meet Leona</a>
      </li>
      <li>
        <a routerLink="/specializations" routerLinkActive="text-[#00465f] font-semibold" class="px-4 py-2 rounded-full hover:bg-white/50 hover:text-[#00465f] transition-all duration-300">Specializations</a>
      </li>
      <li>
        <a routerLink="/insights" routerLinkActive="text-[#00465f] font-semibold" class="px-4 py-2 rounded-full hover:bg-white/50 hover:text-[#00465f] transition-all duration-300">Insights</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="text-[#00465f] font-semibold" class="px-4 py-2 rounded-full hover:bg-white/50 hover:text-[#00465f] transition-all duration-300">Contact &amp; FAQ</a>
      </li>
    </ul>

    <!-- Book Session Button -->
    <div class="flex items-center gap-4 ml-4">
      <button class="hidden md:inline-flex items-center justify-center px-6 py-2.5 rounded-full bg-[#2a3134] text-white text-[14px] font-medium transition-all duration-300 hover:bg-[#266293] hover:shadow-[0_4px_20px_rgba(38,98,147,0.4)] hover:-translate-y-0.5">
        Book a Session
      </button>
    </div>
    
  </nav>
</div>
