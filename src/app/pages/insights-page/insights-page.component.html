<div class="page-wrapper animated-fade-in">
  <section class="insights-section">
    <h2 class="main-section-title">Editorial Insights</h2>
    
    <div class="articles-immersive-flex">
      @for (article of articles; track article.title) {
        <div class="fluid-article-card">
          <div class="article-visual-shimmer"></div>
          <div class="article-content-box">
            <span class="article-read-time"><i class="ph ph-clock"></i> {{ article.readTime }}</span>
            <h3 class="article-title">{{ article.title }}</h3>
            <p class="article-excerpt">{{ article.excerpt }}</p>
            <button class="action-link">Read Article <i class="ph ph-arrow-right"></i></button>
          </div>
        </div>
      }
    </div>
  </section>
</div>
